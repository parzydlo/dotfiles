set -g default-shell "C:\Users\Jan\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShell_8wekyb3d8bbwe\pwsh.exe"
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Change prefix key to Ctrl+b
set -g prefix C-b

# Enable mouse
set -g mouse on

# Let the app inside the pane handle its own mouse selection.
# psmux will no longer render its drag-selection rectangle.
set -g mouse-selection on

# Disable entering copy mode on mouse scroll
set -g scroll-enter-copy-mode on

# Enable Windows 11 PowerShell-style word/line selection
# Double-click selects a word, triple-click selects a line
set -g pwsh-mouse-selection on

# Disable paste detection so Ctrl+V reaches child apps
set -g paste-detection off

# Window numbering base (default is 1)
set -g base-index 1

# Cursor style: block, underline, or bar
set -g cursor-style block
set -g cursor-blink off

# Scrollback history
set -g history-limit 5000

# Prediction dimming (disable for apps like Neovim)
set -g prediction-dimming on
set -g allow-predictions on

# Key bindings
bind-key -T prefix h split-window -h
bind-key -T prefix v split-window -v

# Claude Code
set -g allow-passthrough on
set -s extended-keys on
# set -as terminal-features 'xterm*:extkeys'

# List of plugins
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-sidebar'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-continuum'

# Styling - poimandres, matched to the oh-my-posh prompt and neovim
#
# Palette (poimandres.nvim lua/poimandres/palette.lua):
#   #1B1E28 background2   #303340 background1   #506477 blueGray3
#   #767C9D blueGray2     #A6ACCD blueGray1     #E4F0FB text
#   #5DE4C7 teal1         #5FB3A1 teal2         #D0679D pink3
#
# GOTCHA: every string below goes through the format engine, where #D and #F
# are the shorthands for pane id and window flags. A hex colour starting with
# D or F must be written ## (#D0679D -> ##D0679D) or it is eaten before the
# style parser sees it. Digits and A/B/C/E need no escape.

# background1, the same lift lualine gives its section b. Two earlier tries
# were wrong: bg=default left the bar indistinguishable from the pane above it
# (its contents read as UI of the program in the active pane), and background3
# #171922, one step below the terminal background, was too faint a step to
# separate them. The foregrounds below are one palette step brighter than they
# would be on #1B1E28 to hold their contrast against this lighter bar.
set -g status-style "bg=#303340,fg=#A6ACCD"

# Session name in blue2, the colour the prompt uses for the path segment.
# NOT pink3 #D0679D: the prompt gives that colour to the user segment, but
# poimandres.omp.json also uses it for a nonzero exit code (the status segment
# and the transient prompt both switch to it), so a permanent #D0679D label
# reads as an error state.
set -g status-left "#[fg=#ADD7FF,bold]#S  "
set -g status-left-length 30

set -g status-right "#[fg=#A6ACCD]%H:%M #[fg=#767C9D]%d-%b-%y"
set -g status-right-length 40

# Tabs carry the accent instead of a background block: active window in
# teal1 + text, inactive dimmed to blueGray3 / blueGray2.
set -g window-status-format "#[fg=#767C9D]#I #[fg=#A6ACCD]#W"
set -g window-status-current-format "#[fg=#5DE4C7]#I #[fg=#E4F0FB,bold]#W"
set -g window-status-separator "   "

# Pane borders: inactive at the same level as nvim's WinSeparator, active one
# step up in muted teal instead of the default hard green.
set -g pane-border-style "fg=#303340"
set -g pane-active-border-style "fg=#5FB3A1"
set -g pane-border-hover-style "fg=#5DE4C7"

# Messages, command prompt and copy-mode selection, off the default
# yellow-on-black. The selection colour is Windows Terminal's own
# selectionBackground, so a psmux selection looks like a terminal selection.
set -g message-style "bg=#303340,fg=#E4F0FB"
set -g message-command-style "bg=#303340,fg=#5DE4C7"
set -g mode-style "bg=#717CB4,fg=#E4F0FB"

# psmux-resurrect
# Relaunch claude in its pane on restore (replays the full saved command
# line, including --resume). Remove 'claude' to get a plain shell instead.
set -g @resurrect-processes 'claude'

# psmux-continuum
# Save interval in minutes (default: 15, set to 0 to disable)
set -g @continuum-save-interval '15'

# Auto-restore when psmux server starts
set -g @continuum-restore 'on'

# Auto-start psmux on Windows login
set -g @continuum-boot 'off'

# Re-register continuum's two hooks with -b (background).
#
# WHY: psmux used to fire hooks from run_server() with a bare
# execute_command_string, skipping the ensure_background() wrapper that
# fire_hooks() applies. Without -b, run-shell takes the foreground path and
# sets the status message "running: <full command line>", so every attach,
# i.e. every session switch, flashed "running: pwsh -NoProfile -File
# .../auto_save.ps1 -IntervalMinutes 15" in the status bar. Fixed in the local
# psmux build (commit 7dfe830, branch fix/hook-run-shell-background), but keep
# -b here: it is correct regardless, and it keeps this config working against a
# stock or older binary.
#
# These must stay AFTER the @plugin lines: psmux sources each plugin.conf
# natively at its `set -g @plugin` line (src/config.rs:1173), and ppm skips
# re-sourcing a plugin that ships a plugin.conf, so whatever comes later wins.
# The commands are copied verbatim from
# ~/.psmux/plugins/psmux-continuum/plugin.conf with -b inserted; re-copy them
# if that plugin is updated.
set-hook -g client-attached 'run-shell -b "pwsh -NoProfile -File \"~/.psmux/plugins/psmux-continuum/scripts/auto_save.ps1\" -IntervalMinutes 15"'
set-hook -g session-created 'run-shell -b "pwsh -NoProfile -File \"~/.psmux/plugins/psmux-continuum/scripts/auto_restore.ps1\""'

# Initialize PPM (keep this line at the very bottom of .psmux.conf)
run '~/.psmux/plugins/ppm/ppm.ps1'
