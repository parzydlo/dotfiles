# fix for random escape sequence appearing when entering fish
set -g escape-time 50

# 256 colour nonsense
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-overrides ',*:sitm=\E[3m,*:ritm=\E[23m'
set-environment -g COLORTERM "truecolor"

# lanuch fish inside tmux
set -g default-command /opt/homebrew/bin/fish
set -g default-shell /opt/homebrew/bin/fish

# use vi keybindings in copy mode
setw -g mode-keys vi

# setup 'v' to begin selection as in vim
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel pbcopy

# new pane opens in current directory
bind c new-window -c "#{pane_current_path}"

# split panes using '|' and '-'
# --- not needed with tmux-pain-control
#bind | split-window -h -c "#{pane_current_path}"
#bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

set -g pane-border-format "#{pane_index} #{pane_current_command}"

# reload config file
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# enable mouse mode
set -g mouse on

#set -g focus-events on
# --- not needed with tmux-sensible

# styling
set -g status-style bg=colour234
set -g window-status-style bg=colour234
set -g window-status-current-style fg=#a6accd,bg=colour234,bold
set -g pane-border-style fg=#171922
set -g pane-active-border-style fg=colour238,bg=default

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tomhey/tmux-remote-sessions'

# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'

# Load in Tmuxline snapshot
#source-file "~/.config/tmux/tmuxlinerc"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"
